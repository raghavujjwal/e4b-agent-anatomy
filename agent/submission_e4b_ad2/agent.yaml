# E4B baseline + the edit-step LoRA edit_v1 served at LoRA scale 0.5 (adapters/edit_v1_s050: the same weights as edit_v1 with lora_alpha 16 instead of 64).
# Only `adapter:` differs from ../submission_e4b. The adapter files (266 MiB) are not in git: the notebook copies them in from Drive; see README.md.
# Baseline header follows.
# E4B baseline: the teammates' flat-search arm (31B reference) with ONLY the model alias changed, so the first
# measurement isolates the model. Sampling, prompt and budgets are separate experiments after it.
name: swe_agent
model: gemma-4-e4b-it-qat-w4a16-ct
adapter: edit_v1_s050
description: Resolves an issue with one minimal source edit.
instruction: !include prompts/flat_search.md
tools:
  - read_file
  - edit_file
  - write_file
  - run_command
  - get_status
  - submit_patch
generate_content_config: !include configs/sampling.yaml
